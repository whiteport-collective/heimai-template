heim: 1                       # the floor plan's format; heimai.yaml in .heimai/ replaces it when the Heim is moved
name: {{name}}
description: {{description}}
kind: {{kind}}                # private | business | project
{{organization_line}}language: {{language}}

heimdocs: {{heimdocs}}        # where everything the Heim writes lives: "." in a Heim that is its own repo,
                              # heimdocs/ when the Heim is dropped into an existing project; the paths below are inside it
people: users/                # one folder per person who works here (the repo cabinet)
sessions: 06-sessions/        # handovers, per person and agent
projects: 04-projects/        # one folder per project, each with feature.yaml
tasks:                        # a folder per field, a file per process; the glass reads `- [ ]` lines only from these
  - tasks/inbox.md
  - tasks/**/*.md
inbox: tasks/inbox.md
{{governance_line}}
agents: [{{agents}}]          # the agents woken here: the sync copies only these and what they use
capabilities: {}              # capabilities installed beyond the woken agents' own, by source (heim: [record-anything])
{{inherits_block}}